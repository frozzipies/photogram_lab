services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idor
      POSTGRES_PASSWORD: idor
      POSTGRES_DB: idordb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idor -d idordb"]
      interval: 3s
      timeout: 3s
      retries: 10
    # The DB port is NOT published to the host on purpose — only the
    # backend talks to it over the internal Docker network.

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://idor:idor@db:5432/idordb
    depends_on:
      db:
        condition: service_healthy
    # The backend port is also kept internal. All traffic flows through
    # the frontend (nginx) so Burp sees a single clean origin.

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
