server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the static frontend.
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy all API calls to the Flask backend. Routing the API through the
    # same origin as the HTML means the browser sends session cookies without
    # any CORS headaches, and Burp Suite sees one clean host to intercept.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_header Set-Cookie;
    }
}
